name: Build ResQTap iOS (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [ personal-dev, main, master ]
    paths:
      - 'ResQTap-iOS/**'
      - '.github/workflows/build_ipa.yml'

jobs:
  build-ios-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile Native iOS ARM64 Binary
        run: |
          cd ResQTap-iOS
          mkdir -p build/Payload/ResQTap.app
          APP_DIR="build/Payload/ResQTap.app"

          echo "[+] Menyusun fail-fail sumber Swift ke binary ARM64..."
          
          # Himpunkan semua fail Swift
          SWIFT_FILES=$(find Sources/ResQTap -name "*.swift")
          
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            -O \
            $SWIFT_FILES \
            -framework UIKit \
            -framework SwiftUI \
            -framework CoreLocation \
            -framework AVFoundation \
            -framework CoreHaptics \
            -framework LocalAuthentication \
            -framework MapKit \
            -o "$APP_DIR/ResQTap"

          echo "[✓] Binary ResQTap berjaya dikompil."
          file "$APP_DIR/ResQTap"

      - name: Create App Bundle Resources & Info.plist
        run: |
          cd ResQTap-iOS
          APP_DIR="build/Payload/ResQTap.app"

          # 1. PkgInfo
          echo -n "APPL????" > "$APP_DIR/PkgInfo"

          # 2. Info.plist
          cat << 'EOF' > "$APP_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>ResQTap</string>
              <key>CFBundleIdentifier</key>
              <string>com.resqtap.sos</string>
              <key>CFBundleName</key>
              <string>ResQTap</string>
              <key>CFBundleDisplayName</key>
              <string>ResQTap</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>16.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>NSLocationWhenInUseUsageDescription</key>
              <string>ResQTap memerlukan lokasi anda untuk menghantar koordinat GPS kepada penjaga dan responden semasa kecemasan.</string>
              <key>NSLocationAlwaysAndWhenInUseUsageDescription</key>
              <string>ResQTap menjejak koordinat di latar belakang bagi fungsi suar SOS dan bilik insiden secara langsung.</string>
              <key>NSFaceIDUsageDescription</key>
              <string>Pengesahan Face ID digunakan untuk keselamatan aplikasi dan akses pantas kad perubatan.</string>
              <key>NSCameraUsageDescription</key>
              <string>Kamera diperlukan untuk imbasan kod QR rakan dan panggilan video kecemasan.</string>
              <key>NSMicrophoneUsageDescription</key>
              <string>Mikrofon diperlukan untuk panggilan suara kecemasan WebRTC.</string>
              <key>UIBackgroundModes</key>
              <array>
                  <string>location</string>
                  <string>remote-notification</string>
                  <string>audio</string>
                  <string>voip</string>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

      - name: Ad-Hoc Sign App & Package IPA
        run: |
          cd ResQTap-iOS/build
          
          # Tandatangan ad-hoc asas (Sideloadly/AltStore akan tandatangan semula dengan sijil peribadi anda)
          codesign --force --deep --sign - "Payload/ResQTap.app"
          
          # Bungkus ke fail .ipa
          zip -qry ResQTap.ipa Payload
          echo "[✓] Fail ResQTap.ipa siap dibina."
          ls -lh ResQTap.ipa

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ResQTap-iOS-Production-IPA
          path: ResQTap-iOS/build/ResQTap.ipa
          if-no-files-found: error
